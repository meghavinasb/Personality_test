<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000000;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #ffffff;
      padding: 20px;
      box-sizing: border-box;
    }
    .feedback-container {
      background-color: #012b33;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 100%;
      width: 100%;
      box-sizing: border-box;
      overflow-y: auto;
    }
    h1 {
      text-align: center;
      color: #0398b3;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      border: 2px dotted #04c3e6;
      padding: 10px;
      border-radius: 8px;
    }
    .photo {
      margin-right: 20px;
    }
    .photo img {
      border-radius: 4px;
      width: 80px;
      height: 100px;
      object-fit: cover;
    }
    .name {
      font-size: 24px;
      color: #0398b3;
      font-weight: bold; 
    }
    .subject {
      font-size: 18px;
      color: #03aecc;
      margin-top: 5px;
    }
    .questions {
      margin-bottom: 20px;
    }
    .question {
      margin-bottom: 20px;
      padding: 10px;
      border: 1px dotted #04c3e6;
      border-radius: 8px;
    }
    .question label {
      cursor: pointer;
      display: block;
      padding: 10px;
    }
    .statement {
      font-size: 18px; 
    }
    .button-container {
      text-align: center;
    }
    button {
      background-color: #026d80;
      color: #fff;
      padding: 12px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
    button:hover {
      background-color: #025766;
    }
    input[type="checkbox"] {
      accent-color: #0398b3;
    }
  </style>
</head>
<body>
  <div class="feedback-container">
    <div class="header">
      <div class="photo">
        <img src="D:/Meghavina/College Internship/subulakshmi_ma'am.jpeg" alt="Passport Photo">
      </div>
      <div class="name">
        Name: Subulakshmi
      </div>
    </div>
    <form id="feedbackForm">
      <div class="questions">
        <h3>Select at least 3 Statements that resonate with the teacher's personality:</h3>
        <div class="question">
          <label>
            <input type="checkbox" name="question" value="Statement 1">
            <span class="statement">This teacher demonstrates a strong commitment to the profession and to the success of each student.</span>
          </label>
        </div>
        <div class="question">
          <label>
            <input type="checkbox" name="question" value="Statement 2">
            <span class="statement">This teacher is able to remain calm and understanding when students struggle or make mistakes.</span>
          </label>
        </div>
        <div class="question">
          <label>
            <input type="checkbox" name="question" value="Statement 3">
            <span class="statement">This teacher understands and shares the feelings of students, showing compassion and support.</span>
          </label>
        </div>
        <div class="question">
          <label>
            <input type="checkbox" name="question" value="Statement 4">
            <span class="statement">This teacher clearly and effectively conveys information and instructions.</span>
          </label>
        </div>
        <div class="question">
          <label>
            <input type="checkbox" name="question" value="Statement 5">
            <span class="statement">This teacher inspires and encourages students to achieve their best.</span>
          </label>
        </div>
        <div class="question">
          <label>
            <input type="checkbox" name="question" value="Statement 6">
            <span class="statement">This teacher gives full attention to students when they speak, showing that their thoughts and feelings are valued and understood.</span>
          </label>
        </div>
        <div class="question">
          <label>
            <input type="checkbox" name="question" value="Statement 7">
            <span class="statement">This teacher has a deep understanding of the subject matter and stays updated with new information.</span>
          </label>
        </div>
        <div class="question">
          <label>
            <input type="checkbox" name="question" value="Statement 8">
            <span class="statement">This teacher provides help and encouragement to students both academically and personally.</span>
          </label>
        </div>
        <div class="question">
          <label>
            <input type="checkbox" name="question" value="Statement 9">
            <span class="statement">This teacher creates a joyful and welcoming classroom environment.</span>
          </label>
        </div>
        <div class="question">
          <label>
            <input type="checkbox" name="question" value="Statement 10">
            <span class="statement">This teacher shows respect for students' ideas, opinions, and individuality.</span>
          </label>
        </div>
      </div>
      <div class="button-container">
        <button type="submit">Submit</button>
        <button type="button" class="next-button" id="nextButton">Next</button>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('feedbackForm');
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    const nextButton = document.getElementById('nextButton');

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      const selectedQuestions = Array.from(checkboxes)
        .filter(question => question.checked)
        .map(question => question.value);
      
      if (selectedQuestions.length < 3) {
        alert('Please select at least 3 questions.');
        return;
      }

      // Show the Next button
      nextButton.style.display = 'inline-block';
      console.log('Selected Questions:', selectedQuestions);
    });

    nextButton.addEventListener('click', function() {
      // Navigate to the next page
      window.location.href = 'T4.html'; 
    });
  </script>
</body>
</html>
